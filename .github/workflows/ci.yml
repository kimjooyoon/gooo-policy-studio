name: Verify
on:
  push:
    branches: [main]
    tags: ['**', '!v*']
  pull_request:
  workflow_call:
    inputs:
      release_version:
        description: Version recorded in the exact portable asset provenance
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Check release asset helpers and failure cases
        run: python3 -I tools/package-release.py --self-test
      - name: Format
        run: test -z "$(gofmt -l cmd internal web/embed.go)"
      - name: Vet
        run: go vet ./...
      - name: Race and domain tests
        run: go test -race ./...
      - name: Build standalone executable
        run: go build -trimpath -o bin/policy-studio ./cmd/server
      - name: Run and replay headless policy requirements
        run: |
          mkdir -p out
          go run ./cmd/policy-check --input examples/automation-policy/impact-input.json > out/impact-report.json
          go run ./cmd/policy-check --replay --input out/impact-report.json > out/impact-replay.json
      - name: Verify the actual machine request gate and durable retries
        run: |
          go build -trimpath -o bin/policy-gate ./cmd/policy-gate
          python3 tools/verify-machine-gate.py --binary bin/policy-gate --out out/machine-gate-proof.json
      - name: Preserve the synthetic machine gate observations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: machine-gate-proof
          path: out/machine-gate-proof.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify actual artifact admission and retained-byte retries
        run: python3 tools/verify-artifact-gate.py --binary bin/policy-gate --out out/artifact-gate-proof.json
      - name: Preserve the artifact admission observations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifact-gate-proof
          path: out/artifact-gate-proof.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify private client preparation and exact saved-command retries
        run: |
          go build -trimpath -o bin/policy-client ./cmd/policy-client
          python3 tools/verify-policy-client.py --client-binary bin/policy-client --gate-binary bin/policy-gate --out out/policy-client-proof.json
      - name: Preserve the private client process observations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: policy-client-proof
          path: out/policy-client-proof.json
          if-no-files-found: error
          retention-days: 14
      - name: Compare one retained artifact under two operator policies
        run: |
          go build -trimpath -o bin/policy-impact ./cmd/policy-impact
          python3 tools/verify-artifact-policy-impact.py --impact-binary bin/policy-impact --gate-binary bin/policy-gate --out out/artifact-policy-impact-proof.json
      - name: Preserve the artifact policy comparison and gate parity observations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifact-policy-impact-proof
          path: out/artifact-policy-impact-proof.json
          if-no-files-found: error
          retention-days: 14
      - name: Replay retained comparisons without original artifact or input files
        run: python3 tools/verify-artifact-policy-replay.py --impact-bin bin/policy-impact --proof out/artifact-policy-replay-proof.json
      - name: Preserve the read-only historical comparison replay observations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifact-policy-replay-proof
          path: out/artifact-policy-replay-proof.json
          if-no-files-found: error
          retention-days: 14
      - name: Check JavaScript syntax
        run: node --check web/app.js
      - name: Check import and pending-operation behavior
        run: node --test tools/policy-impact-app.test.cjs
      - name: Build clean pinned Gooo compiler
        run: |
          git clone --quiet --filter=blob:none https://github.com/kimjooyoon/meta-ontology-go.git "$RUNNER_TEMP/gooo-compiler"
          git -C "$RUNNER_TEMP/gooo-compiler" checkout --quiet "$(cat tools/compiler-version.txt)"
          go -C "$RUNNER_TEMP/gooo-compiler" build -o "$RUNNER_TEMP/gooo" ./cmd/gooo
      - name: Verify source and generated projection
        run: go run ./cmd/generate --compiler "$RUNNER_TEMP/gooo" --check
      - name: Build the separately pinned evidence example compiler
        run: |
          evidence_pin="$(cat examples/evidence-admission/compiler-version.txt)"
          git -C "$RUNNER_TEMP/gooo-compiler" fetch --quiet --depth=1 origin "$evidence_pin"
          git -C "$RUNNER_TEMP/gooo-compiler" worktree add --quiet --detach "$RUNNER_TEMP/evidence-compiler" "$evidence_pin"
          go -C "$RUNNER_TEMP/evidence-compiler" build -trimpath -o "$RUNNER_TEMP/evidence-gooo" ./cmd/gooo
      - name: Execute and replay Rea authority and Gooo evidence admission
        run: |
          python3 -I tools/verify-evidence-admission.py --compiler "$RUNNER_TEMP/evidence-gooo" --go "$(go env GOROOT)/bin/go" --out out/evidence-admission
      - name: Preserve the evidence admission observations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: evidence-admission-observations
          path: out/evidence-admission/*
          if-no-files-found: error
          retention-days: 14
      - name: Execute and replay Rea tool effects and Gooo effect budgets
        run: |
          python3 -I tools/verify-tool-effects.py --compiler "$RUNNER_TEMP/evidence-gooo" --go "$(go env GOROOT)/bin/go" --out out/tool-effects
      - name: Preserve the tool effects observations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tool-effects-observations
          path: out/tool-effects/*
          if-no-files-found: error
          retention-days: 14
      - name: Verify the separately pinned completion projection
        run: go run ./cmd/generate-completion --compiler "$RUNNER_TEMP/evidence-gooo" --check
      - name: Execute and replay Rea completion counts and Gooo required claims
        run: |
          python3 -I tools/verify-completion-ledger.py --compiler "$RUNNER_TEMP/evidence-gooo" --go "$(go env GOROOT)/bin/go" --out out/completion-ledger
      - name: Preserve the completion ledger observations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: completion-ledger-observations
          path: out/completion-ledger/*
          if-no-files-found: error
          retention-days: 14
      - name: Verify the artifact admission Gooo projections
        run: go run ./cmd/generate-machine --compiler "$RUNNER_TEMP/evidence-gooo" --check
      - name: Execute and replay the final Gooo admission relation
        run: python3 tools/verify-machine-rules.py --compiler "$RUNNER_TEMP/evidence-gooo" --go "$(go env GOROOT)/bin/go" --out out/machine-rules-native
      - name: Preserve the final admission relation observations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: machine-rules-native-observations
          path: out/machine-rules-native/*
          if-no-files-found: error
          retention-days: 14
      - name: Build and observe the exact portable release assets
        env:
          RELEASE_VERSION: ${{ inputs.release_version || format('preview-{0}', github.sha) }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 -I tools/package-release.py --out dist --version "$RELEASE_VERSION" --commit "$SOURCE_COMMIT"
      - name: Preserve the checked portable assets and observations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portable-release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 14
