name: Release binaries
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      release_version: ${{ github.ref_name }}
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve only the assets checked in this workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name portable-release-assets --dir dist
      - name: Check exact downloaded asset bytes and source bindings
        run: python3 -I tools/verify-release-assets.py --dist dist --version "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --source .
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --prerelease --title "Gooo Policy Studio $GITHUB_REF_NAME" --notes-file docs/release-notes.md
