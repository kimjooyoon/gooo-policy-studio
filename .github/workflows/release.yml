name: Release binaries
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - run: go test -race ./...
      - name: Build portable binaries
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            target_os="${target%/*}"
            target_arch="${target#*/}"
            suffix=""
            if [ "$target_os" = windows ]; then suffix=".exe"; fi
            CGO_ENABLED=0 GOOS="$target_os" GOARCH="$target_arch" go build -trimpath -o "dist/policy-studio-${target_os}-${target_arch}${suffix}" ./cmd/server
          done
          cp evidence/generation.json dist/generation.json
          cd dist
          sha256sum * > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Gooo Policy Studio $GITHUB_REF_NAME" --notes-file docs/release-notes.md
